"""
Bootstrap-only review subset aligned with the verified live SIRA contract.

This is not a live WPGraphQL snapshot and must never be used as the production
code-generation source. Run `pnpm schema:fetch` to create the canonical branch
schema and separate Group audit schema.
"""
schema {
  query: RootQuery
}

type RootQuery {
  siraBrand: SiraBrand!
  siraProjects: SiraProjectConnection
}

interface ContentNode {
  databaseId: Int!
  uri: String
}

type Page implements ContentNode {
  databaseId: Int!
  uri: String
  isFrontPage: Boolean!
  siraHomepage: SiraHomepage
}

type SiraHomepage {
  variant: String
}

type SiraBrand {
  name: String!
  key: String!
  tagline: String
  primaryColor: String!
  secondaryColor: String!
  accentColor: String!
  paperColor: String!
  inkColor: String!
  logo: SiraBrandMedia
  mark: SiraBrandMedia
  email: String
  phone: String
  address: String
  description: String
  mission: String
  vision: String
  values: [SiraBrandValue]
  officeLocations: [SiraBrandOffice]
  socialProfiles: SiraBrandSocialProfiles
  announcementBanner: String
  emergencyBanner: String
  announcement: SiraBrandBanner
  emergency: SiraBrandBanner
}

type SiraBrandBanner {
  message: String!
  severity: SiraBrandBannerSeverity!
  link: SiraBrandLink
  startsAt: String
  endsAt: String
  dismissible: Boolean!
  revisionKey: String!
}

enum SiraBrandBannerSeverity {
  INFO
  IMPORTANT
  URGENT
}

type SiraBrandLink {
  label: String!
  url: String!
  target: String
}

type SiraBrandMedia {
  databaseId: Int!
  sourceUrl: String!
  altText: String
  width: Int
  height: Int
  mediaItem: MediaItem
}

type SiraBrandValue {
  title: String!
  description: String
}

type SiraBrandOffice {
  name: String!
  address: String
  phone: String
  email: String
}

type SiraBrandSocialProfiles {
  linkedin: String
  instagram: String
  x: String
  youtube: String
}

type SiraProjectConnection {
  nodes: [SiraProject]
}

type SiraProject {
  databaseId: Int!
  title: String
  uri: String
  projectDetails: ProjectDetails
}

"""
Verified live WPGraphQL-for-ACF generated type.
"""
type ProjectDetails {
  subtitle: String
  location: String
  status: String
  statistics: [ProjectDetailsStatistics]
}

type ProjectDetailsStatistics {
  label: String
  value: String
}

type MediaItem {
  databaseId: Int!
  sourceUrl: String
  altText: String
}
