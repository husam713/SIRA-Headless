query SiraStructuredFields($projectSlug: ID!, $personSlug: ID!, $documentSlug: ID!) {
  project: siraProject(id: $projectSlug, idType: SLUG) {
    databaseId
    title
    projectDetails {
      subtitle
      location
      status
      relatedCompany {
        nodes {
          ... on SiraCompany {
            databaseId
            title
            slug
          }
        }
      }
      gallery {
        nodes {
          databaseId
          sourceUrl
          altText
          mediaDetails {
            width
            height
          }
        }
      }
      statistics {
        value
        label
      }
    }
  }

  person: siraLeadershipProfile(id: $personSlug, idType: SLUG) {
    databaseId
    title
    personDetails {
      role
      linkedin
      company {
        nodes {
          ... on SiraCompany {
            databaseId
            title
            slug
          }
        }
      }
    }
  }

  document: siraDocument(id: $documentSlug, idType: SLUG) {
    databaseId
    title
    documentDetails {
      version
      publicationDate
    }
  }
}
