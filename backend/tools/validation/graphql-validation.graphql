query SiraStructuredFields($projectSlug: ID!, $personSlug: ID!, $documentSlug: ID!) {
  project: siraProject(id: $projectSlug, idType: SLUG) {
    databaseId
    title
    projectDetails {
      subtitle
      location
      status
      relatedCompany {
        nodes {
          ... on SiraCompany {
            databaseId
            title
            slug
          }
        }
      }
      gallery {
        nodes {
          databaseId
          sourceUrl
          altText
          mediaDetails {
            width
            height
          }
        }
      }
      statistics {
        value
        label
      }
    }
  }

  person: siraLeadershipProfile(id: $personSlug, idType: SLUG) {
    databaseId
    title
    personDetails {
      role
      linkedin
      company {
        nodes {
          ... on SiraCompany {
            databaseId
            title
            slug
          }
        }
      }
    }
  }

  document: siraDocument(id: $documentSlug, idType: SLUG) {
    databaseId
    title
    documentDetails {
      version
      publicationDate
    }
  }
}

# Step 2C.2B source-verified presentation contract.
# Nested WPGraphQL-for-ACF generated type names remain subject to live schema
# inventory. These operations validate field paths without naming those nested
# object types directly.

query SiraPresentationSchemaTypes {
  homepage: __type(name: "SiraHomepage") {
    fields {
      name
    }
  }
  company: __type(name: "SiraCompanyDetails") {
    fields {
      name
    }
  }
  investment: __type(name: "SiraInvestmentDetails") {
    fields {
      name
    }
  }
  testimonial: __type(name: "SiraTestimonialDetails") {
    fields {
      name
    }
  }
  partner: __type(name: "SiraPartnerDetails") {
    fields {
      name
    }
  }
}

