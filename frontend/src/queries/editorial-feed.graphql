# The Business Unit terms are selected for DISPLAY, not for filtering. The
# unfiltered feed stays unfiltered (B4): `contentNodes` carries no business-unit
# `where` argument, and narrowing to one desk still goes through the term's own
# `contentNodes` connection in SiraBusinessUnitEditorialFeed below.
#
# `first: 4` is a structural bound, not a page: the canonical taxonomy has
# exactly four terms (ADR-014), so this connection cannot truncate and needs no
# pageInfo. An item carrying none of them is Group's own — that is the SIRA
# mapping `group -> null`, not missing data.
fragment EditorialFeedDesks on SiraBusinessUnitConnection {
  nodes {
    databaseId
    slug
  }
}

fragment EditorialFeedMedia on NodeWithFeaturedImageToMediaItemConnectionEdge {
  node {
    databaseId
    sourceUrl
    altText
    mediaDetails {
      width
      height
    }
  }
}

query SiraEditorialFeed($first: Int!, $after: String) {
  contentNodes(
    first: $first
    after: $after
    where: {
      contentTypes: [
        SIRA_NEWS
        SIRA_INSIGHT
        SIRA_ARTICLE
        SIRA_PRESS_RELEASE
      ]
      orderby: [{ field: DATE, order: DESC }]
    }
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      __typename
      databaseId
      contentTypeName
      date
      modified
      uri
      isRestricted

      ... on SiraNewsItem {
        title
        excerpt
        featuredImage {
          ...EditorialFeedMedia
        }
        siraBusinessUnits(first: 4) {
          ...EditorialFeedDesks
        }
      }
      ... on SiraInsight {
        title
        excerpt
        featuredImage {
          ...EditorialFeedMedia
        }
        siraBusinessUnits(first: 4) {
          ...EditorialFeedDesks
        }
      }
      ... on SiraArticle {
        title
        excerpt
        featuredImage {
          ...EditorialFeedMedia
        }
        siraBusinessUnits(first: 4) {
          ...EditorialFeedDesks
        }
      }
      ... on SiraPressRelease {
        title
        excerpt
        featuredImage {
          ...EditorialFeedMedia
        }
        siraBusinessUnits(first: 4) {
          ...EditorialFeedDesks
        }
      }
    }
  }
}

# A branch tenant's feed. The desk is already known from the site key, so the
# terms are not re-selected here: on a branch site every item belongs to that
# branch by construction.
query SiraBusinessUnitEditorialFeed(
  $businessUnit: ID!
  $first: Int!
  $after: String
) {
  siraBusinessUnit(id: $businessUnit, idType: SLUG) {
    contentNodes(
      first: $first
      after: $after
      where: {
        contentTypes: [
          SIRA_NEWS
          SIRA_INSIGHT
          SIRA_ARTICLE
          SIRA_PRESS_RELEASE
        ]
        orderby: [{ field: DATE, order: DESC }]
      }
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        __typename
        databaseId
        contentTypeName
        date
        modified
        uri
        isRestricted

        ... on SiraNewsItem {
          title
          excerpt
          featuredImage {
            ...EditorialFeedMedia
          }
        }
        ... on SiraInsight {
          title
          excerpt
          featuredImage {
            ...EditorialFeedMedia
          }
        }
        ... on SiraArticle {
          title
          excerpt
          featuredImage {
            ...EditorialFeedMedia
          }
        }
        ... on SiraPressRelease {
          title
          excerpt
          featuredImage {
            ...EditorialFeedMedia
          }
        }
      }
    }
  }
}
