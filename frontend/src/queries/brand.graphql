query SiraBrand {
  siraBrand {
    name
    key
    tagline
    taglineAr
    primaryColor
    secondaryColor
    accentColor
    paperColor
    inkColor

    logo {
      databaseId
      sourceUrl
      altText
      width
      height
      mediaItem {
        databaseId
        sourceUrl
        altText
      }
    }

    mark {
      databaseId
      sourceUrl
      altText
      width
      height
      mediaItem {
        databaseId
        sourceUrl
        altText
      }
    }

    email
    phone
    address
    addressAr
    description
    mission
    vision

    values {
      title
      description
    }

    officeLocations {
      name
      address
      phone
      email
      nameAr
      addressAr
      businessUnit
    }

    socialProfiles {
      linkedin
      instagram
      x
      youtube
    }

    announcementBanner
    emergencyBanner

    announcement {
      message
      severity
      link {
        label
        url
        target
      }
      startsAt
      endsAt
      dismissible
      revisionKey
    }

    emergency {
      message
      severity
      link {
        label
        url
        target
      }
      startsAt
      endsAt
      dismissible
      revisionKey
    }
  }
}
