name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "AGENTS.md"
      - "project-state.json"
      - "docs/**"
  push:
    branches:
      - main
      - step-2c3c-typed-query-contracts
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify patch whitespace
        working-directory: .
        run: git diff --check HEAD^1 HEAD

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify checked-in GraphQL schema artifacts
        run: pnpm schema:check

      - name: Regenerate GraphQL operation contracts
        run: pnpm codegen

      - name: Verify generated GraphQL output is deterministic
        run: git diff --exit-code -- src/generated/graphql

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Production build
        run: pnpm build

      # verify:layout reads the BUILT css out of .next/static/chunks, so it has
      # to follow the build step. Browsers are cached because the Chromium
      # download is larger than the whole rest of this job.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium for the layout verifier
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      # Exits non-zero on a failed assertion, so this is a real gate. Its
      # whole-page counterpart (verify:alignment) is deliberately NOT wired in:
      # it needs a captured deployment, which CI has no credentials for.
      - name: Verify shared layout primitives
        run: pnpm verify:layout

      - name: Run local Draft Mode runtime verification
        run: pnpm test:runtime-preview
