query SiraProjects($first: Int!, $after: String) {
  siraProjects(first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }

    nodes {
      databaseId
      title
      slug
      uri
      excerpt

      featuredImage {
        node {
          databaseId
          sourceUrl
          altText
          mediaDetails {
            width
            height
          }
        }
      }

      projectDetails {
        subtitle
        location
        status

        relatedCompany {
          nodes {
            ... on SiraCompany {
              databaseId
              title
              slug
              uri
            }
          }
        }

        gallery {
          nodes {
            databaseId
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }

        statistics {
          value
          label
        }
      }
    }
  }
}
