# SIRA Step 1G GraphQL validation operations
# Run against each Multisite site's /graphql endpoint.
# The investor collection must be tested with an authenticated user and must
# disclose no records anonymously.

query SiraSchemaTypes {
  root: __type(name: "RootQuery") {
    fields {
      name
    }
  }
  brand: __type(name: "SiraBrand") {
    fields {
      name
    }
  }
  projectDetails: __type(name: "SiraProjectDetails") {
    fields {
      name
    }
  }
  personDetails: __type(name: "SiraPersonDetails") {
    fields {
      name
    }
  }
  documentDetails: __type(name: "SiraDocumentDetails") {
    fields {
      name
    }
  }
}

query SiraBrandValidation {
  siraBrand {
    name
    key
    tagline
    primaryColor
    secondaryColor
    accentColor
    paperColor
    inkColor
    logo {
      databaseId
      sourceUrl
      altText
      width
      height
      mediaItem {
        id
        databaseId
        sourceUrl
        altText
      }
    }
    mark {
      databaseId
      sourceUrl
      altText
      width
      height
    }
    email
    phone
    address
    description
    mission
    vision
    values {
      title
      description
    }
    officeLocations {
      name
      address
      phone
      email
    }
    socialProfiles {
      linkedin
      instagram
      x
      youtube
    }
    announcementBanner
    emergencyBanner
  }
}

