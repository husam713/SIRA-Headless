query SiraPresentationEntityContract(
  $companySlug: ID!
  $investmentSlug: ID!
  $testimonialSlug: ID!
  $partnerSlug: ID!
) {
  company: siraCompany(id: $companySlug, idType: SLUG) {
    databaseId
    companyDetails {
      operatingStatus
      externalWebsiteUrl
      shortDescriptor
      cardImageOverride {
        node {
          databaseId
          sourceUrl
          altText
        }
      }
    }
    siraBusinessUnits(first: 10) {
      nodes {
        databaseId
        name
        slug
      }
    }
  }

  investment: siraInvestment(id: $investmentSlug, idType: SLUG) {
    databaseId
    investmentDetails {
      publicDisplay
      ticketSizeLabel
      relatedCompany {
        nodes {
          databaseId
          title
          slug
        }
      }
      relatedProject {
        nodes {
          databaseId
          title
          slug
        }
      }
      onePagerDocument {
        nodes {
          __typename
          databaseId
        }
      }
    }
  }

  testimonial: siraTestimonial(id: $testimonialSlug, idType: SLUG) {
    databaseId
    testimonialDetails {
      role
      organization
      consentApproved
      sourceUrl
    }
  }

  partner: siraPartner(id: $partnerSlug, idType: SLUG) {
    databaseId
    partnerDetails {
      websiteUrl
      relationshipLabel
      logoAltOverride
    }
  }
}



# Step 2C.2C privacy checks.
#
# Supply database IDs for staging fixtures. Anonymous requests must return
# null for unapproved IDs and a node for approved IDs. Repeat with an
# authenticated editor who can edit each fixture.
query SiraPresentationPrivacySingles(
  $investmentId: ID!
  $testimonialId: ID!
) {
  investment: siraInvestment(
    id: $investmentId
    idType: DATABASE_ID
  ) {
    id
    databaseId
    title
  }

  testimonial: siraTestimonial(
    id: $testimonialId
    idType: DATABASE_ID
  ) {
    id
    databaseId
    title
  }
}

query SiraPresentationPrivacyCollections {
  siraInvestments(first: 100) {
    nodes {
      databaseId
      investmentDetails {
        publicDisplay
      }
    }
  }

  siraTestimonials(first: 100) {
    nodes {
      databaseId
      testimonialDetails {
        consentApproved
      }
    }
  }
}


# Step 2C.2F typed banner contract.
#
# Legacy string fields remain queryable. The typed fields are null when no
# banner is active or when a configured schedule is invalid/outside its window.
query SiraTypedBanners {
  siraBrand {
    announcementBanner
    emergencyBanner

    announcement {
      message
      severity
      link {
        label
        url
        target
      }
      startsAt
      endsAt
      dismissible
      revisionKey
    }

    emergency {
      message
      severity
      link {
        label
        url
        target
      }
      startsAt
      endsAt
      dismissible
      revisionKey
    }
  }
}
